name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  OBS_VERSION: "31.1.1"
  OBS_DEPS_VERSION: "2025-07-11"
  PLUGIN_NAME: "obs-hyperate"

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake ninja pkg-config libwebsockets dylibbundler

      - name: Build local libobs development files
        run: |
          bash scripts/setup-obs-dev-macos.sh
          bash scripts/build-local-libobs-macos.sh

      - name: Configure plugin
        env:
          HYPERATE_API_TOKEN_SECRET: ${{ secrets.HYPERATE_API_TOKEN }}
        run: |
          search_dirs=(.deps/obs-build)
          if [[ -d .deps/obs-install ]]; then
            search_dirs+=(.deps/obs-install)
          fi
          libobs_config="$(find "${search_dirs[@]}" \( -name libobsConfig.cmake -o -name libobs-config.cmake \) | head -n 1)"
          libobs_dir="$(dirname "${libobs_config}")"

          token_arg=()
          if [[ -n "${HYPERATE_API_TOKEN_SECRET}" ]]; then
            token_arg=(-DHYPERATE_API_TOKEN="${HYPERATE_API_TOKEN_SECRET}")
          fi

          cmake --preset macos-ninja -Dlibobs_DIR="${libobs_dir}" "${token_arg[@]}"

      - name: Build plugin
        run: cmake --build --preset macos-ninja

      - name: Package plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${version}" == "${GITHUB_REF_NAME}" ]]; then
            version="$(jq -r '.version' buildspec.json)"
          fi

          rm -rf package release
          mkdir -p package release

          ditto build_macos_ninja/obs-hyperate.plugin package/obs-hyperate.plugin
          bash scripts/bundle-macos-dylibs.sh package/obs-hyperate.plugin

          ditto -c -k --keepParent package/obs-hyperate.plugin "release/obs-hyperate-${version}-macos.zip"

          pkgroot="pkgroot"
          rm -rf "${pkgroot}"
          mkdir -p "${pkgroot}/Library/Application Support/obs-studio/plugins"
          ditto package/obs-hyperate.plugin "${pkgroot}/Library/Application Support/obs-studio/plugins/obs-hyperate.plugin"

          # OBS on macOS only scans ~/Library/Application Support/obs-studio/plugins,
          # never /Library. A plain component pkg installs system-wide, so wrap it in
          # a distribution that enables only the currentUserHome domain: the payload
          # (rooted at Library/...) then lands in the user's home and needs no admin
          # password.
          pkgbuild \
            --root "${pkgroot}" \
            --identifier "io.hyperate.obs.plugin" \
            --version "${version}" \
            --install-location "/" \
            "component.pkg"

          cat > distribution.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
              <title>OBS HypeRate</title>
              <domains enable_anywhere="false" enable_currentUserHome="true" enable_localSystem="false"/>
              <options customize="never" require-scripts="false" hostArchitectures="arm64,x86_64"/>
              <choices-outline>
                  <line choice="default"/>
              </choices-outline>
              <choice id="default" title="OBS HypeRate">
                  <pkg-ref id="io.hyperate.obs.plugin"/>
              </choice>
              <pkg-ref id="io.hyperate.obs.plugin" version="${version}">component.pkg</pkg-ref>
          </installer-gui-script>
          XML

          productbuild \
            --distribution distribution.xml \
            --package-path . \
            "release/obs-hyperate-${version}-macos.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: obs-hyperate-macos
          path: release/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config build-essential zip libobs-dev libwebsockets-dev

      - name: Configure plugin
        env:
          HYPERATE_API_TOKEN_SECRET: ${{ secrets.HYPERATE_API_TOKEN }}
        run: |
          token_arg=()
          if [[ -n "${HYPERATE_API_TOKEN_SECRET}" ]]; then
            token_arg=(-DHYPERATE_API_TOKEN="${HYPERATE_API_TOKEN_SECRET}")
          fi

          cmake --preset ubuntu-x86_64 "${token_arg[@]}"

      - name: Build plugin
        run: cmake --build --preset ubuntu-x86_64

      - name: Package plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${version}" == "${GITHUB_REF_NAME}" ]]; then
            version="$(jq -r '.version' buildspec.json)"
          fi

          rm -rf package release
          mkdir -p package/obs-hyperate/bin/64bit package/obs-hyperate/data release
          cp build_x86_64/obs-hyperate.so package/obs-hyperate/bin/64bit/
          cp -R data/. package/obs-hyperate/data/
          (cd package && zip -r "../release/obs-hyperate-${version}-linux-x86_64.zip" obs-hyperate)

          payload="release/obs-hyperate-${version}-linux-x86_64.payload.tar.gz"
          tar -czf "${payload}" -C package obs-hyperate

          installer="release/obs-hyperate-${version}-linux-x86_64-installer.run"
          cat > "${installer}" <<'INSTALLER'
          #!/bin/sh
          set -eu

          install_dir="${XDG_CONFIG_HOME:-$HOME/.config}/obs-studio/plugins"
          archive_line="$(awk '/^__OBS_HYPERATE_ARCHIVE_BELOW__/ {print NR + 1; exit}' "$0")"

          mkdir -p "${install_dir}"
          tail -n +"${archive_line}" "$0" | tar -xz -C "${install_dir}"

          echo "OBS HypeRate was installed to: ${install_dir}/obs-hyperate"
          echo "Restart OBS Studio to load the plugin."
          exit 0
          __OBS_HYPERATE_ARCHIVE_BELOW__
          INSTALLER
          cat "${payload}" >> "${installer}"
          chmod +x "${installer}"
          rm "${payload}"

      - uses: actions/upload-artifact@v4
        with:
          name: obs-hyperate-linux-x86_64
          path: release/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      # Static libs (libwebsockets, OpenSSL, zlib, libuv) linked straight into
      # obs-hyperate.dll, but still the dynamic MSVC runtime that OBS uses (-md).
      # Shipping sibling DLLs with generic names (z.dll, uv.dll, libssl-3-x64.dll)
      # collided with other OBS plugins: Windows loads only one DLL per name per
      # process, so whichever plugin loaded first won and our plugin failed to load.
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install installer dependencies
        run: choco install nsis -y --no-progress

      - name: Prepare vcpkg binary cache directory
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # Cache vcpkg's compiled binary packages (openssl, libuv, libwebsockets, ...).
      # VCPKG_DEFAULT_BINARY_CACHE is set in this job's env, so unlike the runner's
      # VCPKG_INSTALLATION_ROOT it resolves in the ${{ env.* }} context and the path
      # actually exists at save time. Restoring these drops the Windows build from
      # ~18 min to ~2-3 min.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-libwebsockets-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-windows-libwebsockets-

      - name: Install libwebsockets
        run: |
          vcpkg install libwebsockets:x64-windows-static-md --clean-after-build
          "VCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Prepare OBS development files
        run: |
          $depsRoot = Join-Path $PWD ".deps"
          $downloads = Join-Path $depsRoot "downloads"
          $obsSource = Join-Path $depsRoot "obs-studio-${env:OBS_VERSION}"
          $obsDeps = Join-Path $depsRoot "obs-deps-${env:OBS_DEPS_VERSION}-x64"
          $obsBuild = Join-Path $depsRoot "obs-build"
          $obsInstall = Join-Path $depsRoot "obs-install"
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null

          $obsZip = Join-Path $downloads "obs-studio-${env:OBS_VERSION}.zip"
          $obsDepsZip = Join-Path $downloads "windows-deps-${env:OBS_DEPS_VERSION}-x64.zip"
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/archive/refs/tags/${env:OBS_VERSION}.zip" -OutFile $obsZip
          Invoke-WebRequest "https://github.com/obsproject/obs-deps/releases/download/${env:OBS_DEPS_VERSION}/windows-deps-${env:OBS_DEPS_VERSION}-x64.zip" -OutFile $obsDepsZip

          Expand-Archive $obsZip -DestinationPath $depsRoot -Force
          $expandedObsSource = Get-ChildItem $depsRoot -Directory | Where-Object { $_.Name -like "obs-studio-*" } | Select-Object -First 1
          if ($null -eq $expandedObsSource) {
            throw "Could not find extracted OBS Studio source directory"
          }
          if ((Test-Path $obsSource) -and ($expandedObsSource.FullName -ne $obsSource)) {
            Remove-Item $obsSource -Recurse -Force
          }
          if ($expandedObsSource.FullName -ne $obsSource) {
            Move-Item $expandedObsSource.FullName $obsSource
          }

          New-Item -ItemType Directory -Force -Path $obsDeps | Out-Null
          Expand-Archive $obsDepsZip -DestinationPath $obsDeps -Force
          "OBS_DEPS_DIR=$obsDeps" >> $env:GITHUB_ENV

          cmake `
            -S $obsSource `
            -B $obsBuild `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=RelWithDebInfo `
            -DCMAKE_PREFIX_PATH="$obsDeps" `
            -DCMAKE_INSTALL_PREFIX="$obsInstall" `
            -DENABLE_UI=OFF `
            -DENABLE_FRONTEND=OFF `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_BROWSER=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_AJA=OFF `
            -DENABLE_DECKLINK=OFF `
            -DENABLE_WEBRTC=OFF `
            -DENABLE_VLC=OFF

          cmake --build $obsBuild --target libobs --config RelWithDebInfo

      - name: Configure plugin
        env:
          HYPERATE_API_TOKEN_SECRET: ${{ secrets.HYPERATE_API_TOKEN }}
        run: |
          $libobsConfig = Get-ChildItem ".deps/obs-build", ".deps/obs-install" -Recurse -Include "libobsConfig.cmake", "libobs-config.cmake" | Select-Object -First 1
          if ($null -eq $libobsConfig) {
            throw "Could not find libobsConfig.cmake"
          }

          $prefixPaths = @(
            $env:OBS_DEPS_DIR,
            $env:VCPKG_INSTALLED_DIR,
            (Resolve-Path ".deps/obs-build").Path,
            (Resolve-Path ".deps/obs-build/deps/w32-pthreads").Path
          )

          # The vcpkg toolchain resolves libwebsockets' transitive static dependencies
          # (OpenSSL, zlib, libuv) through its exported CMake package config.
          #
          # Only generate RelWithDebInfo, the configuration we actually build. libobs
          # is built RelWithDebInfo-only, and the vcpkg toolchain sets
          # CMAKE_MAP_IMPORTED_CONFIG_MINSIZEREL, which stops CMake from falling back
          # to it for the other configurations the VS generator would emit.
          $args = @(
            "--preset", "windows-x64",
            "-Dlibobs_DIR=$($libobsConfig.Directory.FullName)",
            "-DCMAKE_PREFIX_PATH=$($prefixPaths -join ';')",
            "-DCMAKE_CONFIGURATION_TYPES=RelWithDebInfo",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md"
          )

          $w32PthreadsConfig = Get-ChildItem ".deps/obs-build" -Recurse -Include "w32-pthreadsConfig.cmake", "w32-pthreads-config.cmake" | Select-Object -First 1
          if ($null -ne $w32PthreadsConfig) {
            $args += "-Dw32-pthreads_DIR=$($w32PthreadsConfig.Directory.FullName)"
          }

          if ($env:HYPERATE_API_TOKEN_SECRET) {
            $args += "-DHYPERATE_API_TOKEN=$env:HYPERATE_API_TOKEN_SECRET"
          }

          cmake @args

      - name: Build plugin
        run: cmake --build --preset windows-x64

      - name: Package plugin
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          if ($version -eq $env:GITHUB_REF_NAME) {
            $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          }

          $packageRoot = Join-Path $PWD "package/obs-studio"
          $binDir = Join-Path $packageRoot "obs-plugins/64bit"
          $dataDir = Join-Path $packageRoot "data/obs-plugins/obs-hyperate"
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $binDir, $dataDir, $releaseDir | Out-Null

          Copy-Item "build_x64/RelWithDebInfo/obs-hyperate.dll" $binDir
          Copy-Item "data/*" $dataDir -Recurse

          # No sibling runtime DLLs: libwebsockets, OpenSSL, zlib and libuv are
          # linked statically into obs-hyperate.dll. Verify that, so a regression
          # back to a shared build fails the release instead of shipping a plugin
          # that cannot load on machines where the DLL names collide.
          $extraDlls = Get-ChildItem $binDir -Filter *.dll | Where-Object { $_.Name -ne "obs-hyperate.dll" }
          if ($extraDlls) {
            throw "Unexpected runtime DLLs in package: $($extraDlls.Name -join ', ')"
          }

          Compress-Archive -Path "$packageRoot/*" -DestinationPath (Join-Path $releaseDir "obs-hyperate-${version}-windows-x64.zip") -Force

          $installerScript = Join-Path $PWD "obs-hyperate-installer.nsi"
          @'
          !include "MUI2.nsh"

          Name "OBS HypeRate"
          OutFile "release\obs-hyperate-${VERSION}-windows-x64-installer.exe"
          InstallDir "$PROGRAMFILES64\obs-studio"
          RequestExecutionLevel admin
          ShowInstDetails show
          ShowUninstDetails show

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            RMDir /r "$APPDATA\obs-studio\plugins\obs-hyperate"
            SetOutPath "$INSTDIR\obs-plugins\64bit"
            File /r "package\obs-studio\obs-plugins\64bit\*.*"
            SetOutPath "$INSTDIR\data\obs-plugins\obs-hyperate"
            File /r "package\obs-studio\data\obs-plugins\obs-hyperate\*.*"
            WriteUninstaller "$INSTDIR\data\obs-plugins\obs-hyperate\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OBS HypeRate" "DisplayName" "OBS HypeRate"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OBS HypeRate" "UninstallString" "$\"$INSTDIR\data\obs-plugins\obs-hyperate\Uninstall.exe$\""
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OBS HypeRate" "DisplayVersion" "${VERSION}"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OBS HypeRate" "Publisher" "HypeRate"
          SectionEnd

          Section "Uninstall"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OBS HypeRate"
            SetOutPath "$TEMP"
            Delete "$INSTDIR\obs-plugins\64bit\obs-hyperate.dll"
            Delete "$INSTDIR\obs-plugins\64bit\websockets.dll"
            Delete "$INSTDIR\obs-plugins\64bit\libssl-3-x64.dll"
            Delete "$INSTDIR\obs-plugins\64bit\libcrypto-3-x64.dll"
            Delete "$INSTDIR\obs-plugins\64bit\uv.dll"
            Delete "$INSTDIR\obs-plugins\64bit\z.dll"
            Delete "$INSTDIR\obs-plugins\64bit\zlib.dll"
            Delete "$INSTDIR\obs-plugins\64bit\pthreadVC3.dll"
            Delete "$INSTDIR\obs-plugins\64bit\pthreadVCE3.dll"
            Delete "$INSTDIR\obs-plugins\64bit\pthreadVSE3.dll"
            Delete "$INSTDIR\obs-plugins\64bit\legacy.dll"
            RMDir /r "$INSTDIR\data\obs-plugins\obs-hyperate"
          SectionEnd
          '@ | Set-Content -Path $installerScript -Encoding ASCII

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            $makensis = "makensis"
          }
          & $makensis "/DVERSION=$version" $installerScript

      - uses: actions/upload-artifact@v4
        with:
          name: obs-hyperate-windows-x64
          path: release/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
